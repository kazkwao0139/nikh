[package]
name = "nike_app"
version = "0.1.6"
edition = "2021"
description = "NIKH — 판례 유사검색 (오프라인, 생성 0)"

[lib]
name = "nike_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
nike_core = { path = "../../nike_core" }
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
open = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSURL", "NSDictionary", "NSObject"] }

[patch.crates-io]
tao = { path = "../../vendor/tao" }
tauri-runtime-wry = { path = "../../vendor/tauri-runtime-wry" }   # Event::Resumed/Suspended → WindowEvent 매핑(tao 0.37)   # iOS 27 UIScene: tao 0.37.1 을 0.35.4 로 이름만 바꿔 패치(tauri-runtime-wry 2.11 은 ^0.35 요구)
